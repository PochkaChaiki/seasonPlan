services:
  postgres:
    image: postgres:14
    container_name: seasonplan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seasonplan}
      POSTGRES_USER: ${POSTGRES_USER:-seasonplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seasonplan_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seasonplan} -d ${POSTGRES_DB:-seasonplan}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:9.22-alpine
    container_name: seasonplan-flyway
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-seasonplan}
      - -user=${POSTGRES_USER:-seasonplan}
      - -password=${POSTGRES_PASSWORD:-seasonplan_dev}
      - -connectRetries=60
      - migrate
    volumes:
      - ./backend/src/main/resources/db/migration:/flyway/sql:ro

volumes:
  postgres-data:
