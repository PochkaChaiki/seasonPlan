spring:
  application:
    name: seasonplan
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:seasonplan}
    username: ${POSTGRES_USER:seasonplan}
    password: ${POSTGRES_PASSWORD:seasonplan_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never

server:
  port: ${BACKEND_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  forward-headers-strategy: framework

management:
  server:
    address: 127.0.0.1
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info

integrations:
  pollen-tree:
    mode: ${POLLEN_TREE_MODE:rest}
    base-url: ${POLLEN_TREE_BASE_URL:}
    api-key: ${POLLEN_TREE_API_KEY:}
    connect-timeout: ${POLLEN_TREE_CONNECT_TIMEOUT:2s}
    read-timeout: ${POLLEN_TREE_READ_TIMEOUT:3s}
    fake-capacity-grams: ${POLLEN_TREE_FAKE_CAPACITY_GRAMS:1000}

---
spring:
  config:
    activate:
      on-profile: dev
integrations:
  pollen-tree:
    mode: ${POLLEN_TREE_MODE:fake}
