spring:
  application:
    name: seasonplan
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:seasonplan}
    username: ${POSTGRES_USER:seasonplan}
    password: ${POSTGRES_PASSWORD:seasonplan_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

